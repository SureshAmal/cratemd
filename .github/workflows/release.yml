name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.0.1)'
        required: false
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: cratemd
          - os: macos-13
            target: x86_64-apple-darwin
            binary: cratemd
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: cratemd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: cratemd.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release assets (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          PKG_NAME="cratemd-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$PKG_NAME/"
          cp README.md "$PKG_NAME/"
          tar -czvf "${PKG_NAME}.tar.gz" "$PKG_NAME"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          fi

      - name: Package release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $pkg = "cratemd-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $pkg
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" -Destination $pkg
          Copy-Item "README.md" -Destination $pkg
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"
          Get-FileHash -Algorithm SHA256 "$pkg.zip" | ForEach-Object { "$($_.Hash.ToLower())  $pkg.zip" } | Out-File -Encoding ASCII "$pkg.zip.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cratemd-${{ matrix.target }}
          path: |
            cratemd-*.tar.gz*
            cratemd-*.zip*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
