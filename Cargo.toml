[package]
name = "cratemd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.6", features = ["full", "extra-traits", "visit"] }
toml = "1.1.6"
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
strip = true
