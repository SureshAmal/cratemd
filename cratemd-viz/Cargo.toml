[package]
name = "cratemd-viz"
version = "0.0.1"
edition = "2024"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
egui_commonmark = { version = "0.20", default-features = false, features = ["better_syntax_highlighting"] }
petgraph = "0.7"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.5"
cratemd = { path = ".." }
